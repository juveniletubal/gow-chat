<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#2f6f5e">
<title>Nook</title>
<style>
:root{--bg:#fafaf7;--fg:#161a18;--mut:#7a837f;--acc:#2f6f5e;--oth:#ebeee9;--line:#dde2dc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1412;--fg:#e8ede9;--mut:#8b9691;--acc:#3f8f78;--oth:#1d2723;--line:#25302b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.v{height:var(--vh,100dvh);max-width:720px;margin:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.bar b{flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc)}
.pri{background:var(--acc);color:#fff;font-weight:600}
input[type=text]{font:inherit;color:inherit;background:var(--oth);border:0;border-radius:22px;padding:11px 15px;flex:1;min-width:0}
.row{display:flex;gap:8px;padding:10px}
#login{justify-content:center;padding:24px;gap:12px}
#login h1{margin:0;font-size:32px;letter-spacing:-.02em}
#login p{margin:0 0 8px;color:var(--mut)}
#list,#msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 12px;-webkit-overflow-scrolling:touch}
.c{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);border-radius:0}
.c span{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);text-align:center;margin-top:40px}
.m{max-width:78%;margin:3px 0;padding:8px 12px;border-radius:18px;background:var(--oth);width:fit-content;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{background:var(--acc);color:#fff;margin-left:auto}
.m.md{padding:3px;background:none}
.m img,.m video{display:block;max-width:100%;max-height:300px;border-radius:14px}
.m small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.note{font-size:12px;color:var(--mut);text-align:center;padding:4px}
.comp{display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#call{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#lv{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:90px;height:130px;object-fit:cover;border-radius:12px;background:#222;z-index:2}
#call .end{position:relative;z-index:2;background:#d33;color:#fff;border-radius:30px;padding:14px 28px;font-weight:600}
#cn{position:absolute;top:30%;color:#fff;z-index:1;font-size:20px;text-shadow:0 1px 6px #000}
#inc{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:10;background:var(--fg);color:var(--bg);border-radius:16px;padding:12px;display:flex;align-items:center;gap:8px}
#inc b{flex:1}
</style></head>
<body>
<section id="login" class="v" hidden>
  <h1>Nook</h1><p>Pick a nickname. Use the same one later to get your chats back.</p>
  <div class="row" style="padding:0"><input id="nick" type="text" maxlength="20" placeholder="Nickname" autocapitalize="none" autocomplete="off"><button class="pri" id="go">Enter</button></div>
</section>

<section id="home" class="v" hidden>
  <div class="bar"><b id="who"></b><button id="out">Switch</button></div>
  <div class="row"><input id="to" type="text" maxlength="20" placeholder="Chat with a nickname" autocapitalize="none" autocomplete="off"><button class="pri" id="new">Chat</button></div>
  <div id="list"></div>
</section>

<section id="chat" class="v" hidden>
  <div class="bar"><button id="back" aria-label="Back">&#8592;</button><b id="pn"></b>
    <button id="vc" aria-label="Voice call">&#128222;</button><button id="vv" aria-label="Video call">&#127909;</button></div>
  <div class="note">Messages disappear after 12 hours</div>
  <div id="msgs"></div>
  <div class="comp">
    <button id="att" aria-label="Attach">&#128206;</button><input id="file" type="file" accept="image/*,video/*" hidden>
    <input id="txt" type="text" placeholder="Message" autocomplete="off" enterkeyhint="send">
    <button class="pri" id="snd">Send</button>
  </div>
</section>

<div id="call" hidden><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div id="cn"></div><button class="end" id="hang">End call</button></div>
<div id="inc" hidden><b id="incn"></b><button class="pri" id="acc">Answer</button><button id="dec">Decline</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='YOUR_SUPABASE_URL', SB_KEY='YOUR_SUPABASE_ANON_KEY';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), H=12*36e5;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
let me,peer,pc,ls,cp,pend,q=[],chans={};

const show=v=>['login','home','chat'].forEach(x=>$('#'+x).hidden=x!==v);
const clean=s=>(s||'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20);
const live=m=>Date.now()-new Date(m.created_at)<H;
const hm=d=>new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

function login(n){
  me=clean(n); if(!me) return;
  localStorage.nick=me; $('#who').textContent=me; show('home'); chats(); sweep();
  sb.channel('in:'+me).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient=eq.'+me},
    ({new:m})=>{ if(peer===m.sender&&!$('#chat').hidden) add(m); else chats(); }).subscribe();
  sb.channel('call:'+me).on('broadcast',{event:'s'},({payload:p})=>signal(p)).subscribe();
}
$('#go').onclick=()=>login($('#nick').value);
$('#nick').onkeydown=e=>e.key==='Enter'&&login($('#nick').value);
$('#out').onclick=()=>{localStorage.removeItem('nick');sb.removeAllChannels();chans={};show('login')};

async function chats(){
  const {data}=await sb.from('messages').select('*').or(`sender.eq.${me},recipient.eq.${me}`).order('created_at',{ascending:false}).limit(500);
  const seen={}; (data||[]).filter(live).forEach(m=>{const p=m.sender===me?m.recipient:m.sender; if(!seen[p]) seen[p]=m;});
  const l=$('#list'); l.innerHTML='';
  const ks=Object.keys(seen);
  if(!ks.length) l.innerHTML='<div class="empty">No chats yet. Type a nickname above.</div>';
  ks.forEach(p=>{const m=seen[p],b=document.createElement('button');b.className='c';
    const n=document.createElement('b');n.textContent=p;
    const s=document.createElement('span');s.textContent=m.kind==='text'?m.body:'['+m.kind+']';
    b.append(n,s); b.onclick=()=>open(p); l.append(b);});
}
$('#new').onclick=()=>{const p=clean($('#to').value); if(p&&p!==me){$('#to').value='';open(p);}};
$('#to').onkeydown=e=>e.key==='Enter'&&$('#new').click();

async function open(p){
  peer=p; $('#pn').textContent=p; $('#msgs').innerHTML=''; show('chat');
  const {data}=await sb.from('messages').select('*')
    .or(`and(sender.eq.${me},recipient.eq.${p}),and(sender.eq.${p},recipient.eq.${me})`).order('created_at');
  (data||[]).filter(live).forEach(add); $('#txt').focus();
}
$('#back').onclick=()=>{peer=null;show('home');chats()};

function add(m){
  const d=document.createElement('div'); d.className='m'+(m.sender===me?' me':''); d.dataset.t=m.created_at;
  if(m.kind==='image'||m.kind==='video'){
    d.classList.add('md'); const e=document.createElement(m.kind==='image'?'img':'video');
    e.src=m.url; e.loading='lazy'; if(m.kind==='video'){e.controls=true;e.preload='metadata';e.playsInline=true;}
    e.onload=e.onloadedmetadata=()=>scroll(); d.append(e);
  } else d.append(m.body);
  const t=document.createElement('small'); t.textContent=hm(m.created_at); d.append(t);
  $('#msgs').append(d); scroll();
}
const scroll=()=>{const e=$('#msgs'); e.scrollTop=e.scrollHeight};
setInterval(()=>document.querySelectorAll('#msgs .m').forEach(d=>{if(!live({created_at:d.dataset.t}))d.remove()}),6e4);

async function send(kind,body,url){
  const {data,error}=await sb.from('messages').insert({sender:me,recipient:peer,kind,body,url}).select().single();
  if(error) return alert('Could not send: '+error.message); add(data);
}
function sendText(){const v=$('#txt').value.trim(); if(!v)return; $('#txt').value=''; send('text',v); $('#txt').focus();}
$('#snd').onclick=sendText;
['pointerdown','mousedown','touchstart'].forEach(ev=>$('#snd').addEventListener(ev,e=>e.preventDefault(),{passive:false})); // keep focus in the text box so the keyboard stays open
$('#txt').onkeydown=e=>e.key==='Enter'&&sendText();
$('#att').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const k=f.type.startsWith('video')?'video':'image';
  const path=`${me}/${crypto.randomUUID()}-${f.name.replace(/[^\w.]/g,'_')}`;
  const {error}=await sb.storage.from('media').upload(path,f);
  if(error) return alert('Upload failed: '+error.message);
  send(k,'',sb.storage.from('media').getPublicUrl(path).data.publicUrl);
};

/* ---- calls (WebRTC, signaling over Supabase Realtime) ---- */
function tell(to,msg){
  const c=chans[to]||(chans[to]=sb.channel('call:'+to)); if(!c.joinedOnce){c.joinedOnce=1;c.subscribe();}
  c.send({type:'broadcast',event:'s',payload:{from:me,...msg}});
}
async function startPC(to,video){
  cp=to; q=[]; pc=new RTCPeerConnection(ICE);
  try{ls=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false});}
  catch(e){alert('Allow microphone/camera access to call.'); hang(false); return false;}
  ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  $('#lv').srcObject=ls; $('#lv').hidden=!video; $('#rv').srcObject=null; $('#cn').textContent='Calling '+to+'…';
  pc.ontrack=e=>{$('#rv').srcObject=e.streams[0]; $('#cn').textContent='';};
  pc.onicecandidate=e=>e.candidate&&tell(to,{t:'ice',d:e.candidate});
  pc.onconnectionstatechange=()=>['failed','closed'].includes(pc.connectionState)&&hang(false);
  $('#call').hidden=false; return true;
}
async function callPeer(video){
  if(pc) return; if(!await startPC(peer,video)) return;
  const o=await pc.createOffer(); await pc.setLocalDescription(o); tell(peer,{t:'offer',d:o,v:video});
}
$('#vc').onclick=()=>callPeer(false); $('#vv').onclick=()=>callPeer(true);
async function signal(p){
  if(p.t==='offer'){ if(pc||pend){tell(p.from,{t:'end'});return;} pend=p; $('#incn').textContent=p.from+' is calling…'; $('#inc').hidden=false; }
  else if(p.t==='answer'&&pc&&p.from===cp) await pc.setRemoteDescription(p.d).then(()=>q.forEach(c=>pc.addIceCandidate(c))).catch(()=>{});
  else if(p.t==='ice'){ if(pc&&pc.remoteDescription) pc.addIceCandidate(p.d).catch(()=>{}); else if(p.from===cp||(pend&&pend.from===p.from)) q.push(p.d); }
  else if(p.t==='end'){ if(pend&&pend.from===p.from){pend=null;$('#inc').hidden=true;} if(p.from===cp) hang(false); }
}
$('#acc').onclick=async()=>{
  const p=pend; pend=null; $('#inc').hidden=true; if(!p) return;
  if(!await startPC(p.from,p.v)) return;
  await pc.setRemoteDescription(p.d); q.forEach(c=>pc.addIceCandidate(c)); q=[];
  const a=await pc.createAnswer(); await pc.setLocalDescription(a); tell(p.from,{t:'answer',d:a}); $('#cn').textContent='';
};
$('#dec').onclick=()=>{if(pend)tell(pend.from,{t:'end'});pend=null;$('#inc').hidden=true};
function hang(notify=true){
  if(notify&&cp) tell(cp,{t:'end'});
  if(pc) pc.close(); if(ls) ls.getTracks().forEach(t=>t.stop());
  pc=ls=cp=null; q=[]; $('#call').hidden=true;
}
$('#hang').onclick=()=>hang(true);

/* ---- delete photos/videos older than 12 hours (runs when anyone opens the app) ---- */
async function sweep(){
  const {data:dirs}=await sb.storage.from('media').list('',{limit:100});
  for(const d of dirs||[]){
    if(d.id) continue;
    const {data:fs}=await sb.storage.from('media').list(d.name,{limit:100,sortBy:{column:'created_at',order:'asc'}});
    const old=(fs||[]).filter(f=>f.created_at&&Date.now()-new Date(f.created_at)>H).map(f=>d.name+'/'+f.name);
    if(old.length) sb.storage.from('media').remove(old);
  }
}

/* ---- keep the layout above the mobile keyboard ---- */
const vv=window.visualViewport;
function fit(){
  document.documentElement.style.setProperty('--vh',(vv?vv.height:innerHeight)+'px');
  window.scrollTo(0,0);
  if(!$('#chat').hidden) scroll();
}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',()=>window.scrollTo(0,0));}
addEventListener('resize',fit); fit();
$('#txt').addEventListener('focus',()=>setTimeout(fit,300));

/* ---- start ---- */
show('login'); if(localStorage.nick) login(localStorage.nick);
</script>
</body></html>
